<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pulkit Apology</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Georgia", serif;
      background: linear-gradient(135deg, #fdfbfb, #ebedee);
      overflow: hidden;
    }

    .container {
      text-align: center;
    }

    .btn {
      padding: 16px 32px;
      font-size: 1.1rem;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      background: linear-gradient(135deg, #ff758c, #ff7eb3);
      color: white;
      box-shadow: 0 10px 30px rgba(255, 118, 140, 0.3);
      transition: transform 0.2s ease;
    }

    .btn:hover {
      transform: scale(1.05);
    }

    .message {
      display: none;
      max-width: 700px;
      margin-top: 40px;
      padding: 30px;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.08);
      animation: fadeIn 1s ease forwards;
    }

    .quote {
      font-size: 2rem;
      line-height: 1.6;
      color: #444;
      font-style: italic;
    }

    .signature {
      margin-top: 20px;
      font-size: 1.2rem;
      color: #888;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .heart {
      font-size: 2rem;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>
  <div class="container">
    <button class="btn" onclick="showApology()">
      Click for Pulkit Apology
    </button>

    <div class="message" id="apology">
      <div class="heart">❤️</div>

      <div class="quote">
        “If the world is a journey, I am a lost passenger without you,
        so sorry Arushi.”
      </div>

      <div class="signature">
        — Pulkit
      </div>
    </div>
  </div>

  <script>
    function showApology() {
      document.getElementById("apology").style.display = "block";
    }
  </script>
</body>
</html>
