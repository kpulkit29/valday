<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>You Have My Attention</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: radial-gradient(ellipse at center, #2b0f2e 0%, #150818 55%, #05020a 100%);
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
  }

  .bg-hearts {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
  }
  .bg-hearts span {
    position: absolute;
    bottom: -10%;
    font-size: 20px;
    opacity: 0;
    color: #ff6fa5;
    animation: floatUp linear infinite;
  }
  @keyframes floatUp {
    0% { transform: translateY(0) rotate(0deg); opacity: 0; }
    10% { opacity: 0.8; }
    90% { opacity: 0.6; }
    100% { transform: translateY(-115vh) rotate(360deg); opacity: 0; }
  }

  #text-stage {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 5;
    pointer-events: none;
  }
  #text-stage.hide {
    pointer-events: none;
  }
  .headline {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.28em;
    max-width: 90vw;
    padding: 0 16px;
  }
  .headline .word { display: inline-flex; }
  .headline .letter {
    display: inline-block;
    font-size: clamp(26px, 5.4vw, 58px);
    font-weight: 700;
    background: linear-gradient(120deg, #ff9fd6, #ffd6e8, #ff6fa5, #ffb6d5);
    background-size: 300% 300%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    opacity: 0;
    transform: translateY(40px) rotate(6deg) scale(0.6);
    animation:
      letterIn 0.8s cubic-bezier(.2,.9,.25,1.2) forwards,
      shimmer 4s ease-in-out infinite;
    animation-delay: var(--d), 0.6s;
    filter: drop-shadow(0 0 18px rgba(255, 111, 165, 0.45));
  }
  #text-stage.vanish .letter {
    animation: letterOut 0.85s cubic-bezier(.4,0,.2,1) forwards;
    animation-delay: var(--out-d);
  }
  @keyframes letterIn {
    to { opacity: 1; transform: translateY(0) rotate(0) scale(1); }
  }
  @keyframes letterOut {
    to {
      opacity: 0;
      transform: translateY(var(--fly-y, -48px)) translateX(var(--fly-x, 0px)) rotate(var(--fly-r, 12deg)) scale(0.2);
      filter: blur(6px);
    }
  }
  @keyframes shimmer {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }
  .glow-ring {
    position: absolute;
    width: 60vmin;
    height: 60vmin;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,111,165,0.18), transparent 70%);
    filter: blur(10px);
    animation: pulse 3.2s ease-in-out infinite;
    z-index: -1;
    transition: opacity 0.8s ease;
  }
  #text-stage.vanish .glow-ring { opacity: 0; }
  @keyframes pulse {
    0%, 100% { transform: scale(0.9); opacity: 0.6; }
    50% { transform: scale(1.15); opacity: 1; }
  }

  #picture-stage {
    position: fixed;
    inset: 0;
    z-index: 4;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #picture-frame {
    position: relative;
    border-radius: 18px;
    box-shadow: 0 0 0 rgba(255,111,165,0);
    transition: box-shadow 1.2s ease;
  }
  #picture-frame.settled {
    box-shadow: 0 0 60px rgba(255, 111, 165, 0.55), 0 0 140px rgba(255, 182, 213, 0.35);
  }
  #final-photo {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 18px;
    opacity: 0;
    transition: opacity 0.45s ease;
  }
  #final-photo.show { opacity: 1; }

  .piece {
    position: fixed;
    top: 0;
    left: 0;
    margin: 0;
    padding: 0;
    pointer-events: none;
    z-index: 6;
    will-change: transform, opacity;
    border-radius: 3px;
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.45);
    opacity: 0;
  }

  .caption {
    position: absolute;
    left: 50%;
    bottom: -56px;
    transform: translateX(-50%);
    color: #ffd6e8;
    font-size: clamp(14px, 2.4vw, 20px);
    letter-spacing: 0.04em;
    white-space: nowrap;
    opacity: 0;
    transition: opacity 1s ease, bottom 1s ease;
    text-shadow: 0 0 16px rgba(255, 111, 165, 0.5);
  }
  .caption.show { opacity: 1; bottom: -40px; }
</style>
</head>
<body>

  <div class="bg-hearts" id="bg-hearts"></div>

  <div id="text-stage">
    <div class="glow-ring"></div>
    <div class="headline" id="headline"></div>
  </div>

  <div id="picture-stage">
    <div id="picture-frame">
      <img id="final-photo" alt="" />
      <div class="caption" id="caption">forever the most distracting person in every room 💗</div>
    </div>
  </div>

  const MESSAGE = "You know who has got my attention";

  const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

  (function spawnHearts() {
    const container = document.getElementById("bg-hearts");
    const glyphs = ["💗", "💖", "✨", "💫"];
    for (let i = 0; i < 22; i++) {
      const s = document.createElement("span");
      s.textContent = glyphs[Math.floor(Math.random() * glyphs.length)];
      s.style.left = Math.random() * 100 + "%";
      s.style.fontSize = 14 + Math.random() * 18 + "px";
      s.style.animationDuration = 7 + Math.random() * 9 + "s";
      s.style.animationDelay = Math.random() * 10 + "s";
      container.appendChild(s);
    }
  })();

  (function buildHeadline() {
    const headline = document.getElementById("headline");
    const words = MESSAGE.split(" ");
    let globalIndex = 0;
    words.forEach((word) => {
      const wordSpan = document.createElement("span");
      wordSpan.className = "word";
      [...word].forEach((ch) => {
        const letterSpan = document.createElement("span");
        letterSpan.className = "letter";
        letterSpan.textContent = ch;
        letterSpan.style.setProperty("--d", 0.15 + globalIndex * 0.05 + "s");
        const flyX = (Math.random() - 0.5) * 160;
        const flyY = -30 - Math.random() * 80;
        const flyR = (Math.random() - 0.5) * 40;
        letterSpan.style.setProperty("--fly-x", flyX + "px");
        letterSpan.style.setProperty("--fly-y", flyY + "px");
        letterSpan.style.setProperty("--fly-r", flyR + "deg");
        letterSpan.style.setProperty("--out-d", globalIndex * 0.018 + "s");
        wordSpan.appendChild(letterSpan);
        globalIndex++;
      });
      headline.appendChild(wordSpan);
    });
  })();

  function loadImage(src) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = reject;
      img.src = src;
    });
  }

  function createTiles(img) {
    const maxW = Math.min(window.innerWidth * 0.82, 520);
    const maxH = window.innerHeight * 0.68;
    const ratio = img.naturalHeight / img.naturalWidth;
    let width = maxW;
    let height = width * ratio;
    if (height > maxH) {
      height = maxH;
      width = height / ratio;
    }

    const cols = 10;
    const rows = Math.max(8, Math.round(cols * (height / width)));
    const pieceW = width / cols;
    const pieceH = height / rows;

    const source = document.createElement("canvas");
    source.width = Math.round(width);
    source.height = Math.round(height);
    const sctx = source.getContext("2d");
    sctx.drawImage(img, 0, 0, source.width, source.height);

    const pieces = [];
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const canvas = document.createElement("canvas");
        canvas.className = "piece";
        const tw = Math.ceil(pieceW) + 1;
        const th = Math.ceil(pieceH) + 1;
        canvas.width = tw;
        canvas.height = th;
        canvas.style.width = pieceW + "px";
        canvas.style.height = pieceH + "px";
        const ctx = canvas.getContext("2d");
        ctx.drawImage(
          source,
          c * pieceW, r * pieceH, pieceW + 1, pieceH + 1,
          0, 0, tw, th
        );
        document.body.appendChild(canvas);
        pieces.push({ el: canvas, r, c });
      }
    }

    return { pieces, width, height, pieceW, pieceH, cols, rows };
  }

  function scatterPieces(pieces, pieceW, pieceH) {
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    pieces.forEach(({ el }) => {
      const angle = Math.random() * Math.PI * 2;
      const dist = 180 + Math.random() * Math.max(vw, vh) * 0.42;
      const x = vw / 2 + Math.cos(angle) * dist - pieceW / 2;
      const y = vh / 2 + Math.sin(angle) * dist - pieceH / 2;
      const rot = (Math.random() - 0.5) * 540;
      el.style.transition = "none";
      el.style.opacity = "0";
      el.style.transform =
        `translate(${x}px, ${y}px) rotate(${rot}deg) scale(${0.45 + Math.random() * 0.55})`;
    });
  }

  function showScattered(pieces) {
    pieces.forEach(({ el }, i) => {
      el.style.transition = `opacity 0.45s ease ${i * 0.004}s`;
      el.style.opacity = "1";
    });
  }

  function assemblePieces(pieces, pieceW, pieceH, frame) {
    const rect = frame.getBoundingClientRect();
    pieces.forEach(({ el, r, c }) => {
      const distFromCenter = Math.hypot(c - 4.5, r - 4.5);
      const delay = 0.08 + distFromCenter * 0.055 + Math.random() * 0.12;
      const duration = 1.05 + Math.random() * 0.35;
      el.style.transition =
        `transform ${duration}s cubic-bezier(.14,.86,.22,1) ${delay}s, ` +
        `opacity 0.3s ease ${delay}s, box-shadow 0.4s ease ${delay + duration * 0.6}s`;
      el.style.transform =
        `translate(${rect.left + c * pieceW}px, ${rect.top + r * pieceH}px) rotate(0deg) scale(1)`;
      el.style.opacity = "1";
      el.style.boxShadow = "none";
    });
  }

  async function play() {
    const textStage = document.getElementById("text-stage");
    const pictureFrame = document.getElementById("picture-frame");
    const finalPhoto = document.getElementById("final-photo");
    const caption = document.getElementById("caption");

    const img = await loadImage(IMAGE_SRC);
    finalPhoto.src = IMAGE_SRC;

    const letterCount = MESSAGE.replace(/ /g, "").length;
    const textInMs = 150 + letterCount * 50 + 800 + 1600;
    await wait(textInMs);

    const { pieces, width, height, pieceW, pieceH } = createTiles(img);
    pictureFrame.style.width = width + "px";
    pictureFrame.style.height = height + "px";

    scatterPieces(pieces, pieceW, pieceH);
    await wait(40);
    textStage.classList.add("vanish");
    showScattered(pieces);

    await wait(1100);
    assemblePieces(pieces, pieceW, pieceH, pictureFrame);

    await wait(2100);
    finalPhoto.classList.add("show");
    pictureFrame.classList.add("settled");
    caption.classList.add("show");

    await wait(400);
    pieces.forEach(({ el }) => el.remove());

    window.addEventListener("resize", () => {
      const maxW = Math.min(window.innerWidth * 0.82, 520);
      const maxH = window.innerHeight * 0.68;
      const ratio = img.naturalHeight / img.naturalWidth;
      let w = maxW;
      let h = w * ratio;
      if (h > maxH) {
        h = maxH;
        w = h / ratio;
      }
      pictureFrame.style.width = w + "px";
      pictureFrame.style.height = h + "px";
    });
  }

  play().catch((err) => {
    console.error(err);
  });
</script>
